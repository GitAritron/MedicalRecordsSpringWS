# Branding for the Keycloak-hosted pages.
#
# The header normally renders msg("loginTitleHtml", realm.displayNameHtml), which falls back to the
# raw realm name ("medical-records") when the realm has no display name set. Pinning both messages
# here means the sign-in pages carry the application's own name regardless of realm configuration,
# so an existing realm does not have to be re-imported to look right.
#
# The markup mirrors Keycloak's own convention; kcSanitize allows the span and its class.
loginTitle=Sign in to MedicalRecords
loginTitleHtml=<div class="kc-logo-text"><span>MedicalRecords</span></div>
