# MedicalRecords login theme.
#
# parent=keycloak keeps every FreeMarker template and the PatternFly base that Keycloak 23 renders
# with, so login, registration, "update password", error and expired-page screens all keep working
# after an upgrade — this theme only repaints them.
#
# styles= replaces the parent's list rather than extending it, so the parent's css/login.css has to
# be named explicitly. It resolves up the theme chain to the built-in file; ours is listed last so
# it wins the cascade. PatternFly itself is pulled in ahead of both by the inherited stylesCommon.
parent=keycloak
import=common/keycloak

styles=css/login.css css/medical-records.css
