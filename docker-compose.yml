services:
  mysql:
    image: mysql:8.0
    container_name: medical_records_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: medical_records_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Runs first (name order) so the keycloak schema exists before Keycloak connects.
      - ./seed/00-keycloak-db.sql:/docker-entrypoint-initdb.d/00-keycloak-db.sql
      - ./seed/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./seed/test-data.sql:/docker-entrypoint-initdb.d/02-test-data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.4
    container_name: medical_records_keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Without these Keycloak runs on dev-mode H2 inside the container with no volume, so every
      # account created at runtime through KeycloakAdminService disappears on `docker compose down`.
      KC_DB: mysql
      KC_DB_URL: "jdbc:mysql://mysql:3306/keycloak?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8"
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: ${DB_PASSWORD:-root}
    command: start-dev --import-realm --health-enabled=true
    ports:
      - "8081:8080"
    volumes:
      - ./seed/realm-export.json:/opt/keycloak/data/import/realm-export.json
      # The sign-in pages are themed to match the application (see keycloak-theme/README.md).
      # /opt/keycloak/themes holds nothing but a README in the distribution — the built-in themes
      # live inside the themes jar — so mounting one theme directory in beside it is safe.
      # start-dev disables theme caching, so edits here show up on a browser refresh.
      - ./keycloak-theme/medical-records:/opt/keycloak/themes/medical-records
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
