spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/medical-records
          jwk-set-uri: http://localhost:8081/realms/medical-records/protocol/openid-connect/certs

keycloak:
  admin:
    server-url: http://localhost:8081
    realm: medical-records
    username: admin
    password: admin
