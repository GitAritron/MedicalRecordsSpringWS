spring:
  application:
    name: medical-records
  datasource:
    url: jdbc:mysql://localhost:3306/medical_records_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri must match what Keycloak stamps in the JWT's iss claim.
          issuer-uri: ${app.keycloak.public-url}/realms/${app.keycloak.realm}
          jwk-set-uri: ${keycloak.admin.server-url}/realms/${app.keycloak.realm}/protocol/openid-connect/certs
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

keycloak:
  admin:
    server-url: http://localhost:8081
    realm: ${app.keycloak.realm}
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

app:
  keycloak:
    # Browser-facing Keycloak URL. Server-to-server calls use keycloak.admin.server-url separately.
    public-url: ${KEYCLOAK_PUBLIC_URL:http://localhost:8081}
    realm: medical-records
    client-id: frontend-client
